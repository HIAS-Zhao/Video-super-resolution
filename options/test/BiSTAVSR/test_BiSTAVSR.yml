# general settings
name: BiSTAVSR
model_type: VideoRecurrentModel
scale: 4
num_gpu: 1  # set num_gpu: 0 for cpu mode
manual_seed: 0

# dataset and data loader settings
datasets:
  test_1:  # the 1st test dataset
    name: REDS4
    type: VideoRecurrentTestDataset
    dataroot_gt: data/smv/val/GT
    dataroot_lq: data/smv/val/LR4x
    cache_data: True
    io_backend:
      type: disk
    num_frame: -1  # not needed

# network structures
network_g:
  type: BiSTAVSR
  num_block: 30
  keyframe_stride: 5
  temporal_padding: 2
  # spynet_path: ~
  # edvr_path: ~

# path
path:
  pretrain_network_g: experiments/BiSTAVSR/models/net_g_81000.pth
  strict_load_g: true

val:
  save_img: true
  suffix: ~  # add suffix to saved images, if None, use exp name

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: true
    ssim:
      type: calculate_ssim
      crop_border: 0
      test_y_channel: true